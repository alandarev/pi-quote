name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Dev CI runner for push, workflow_dispatch and schedule only; every other event keeps the GitHub-hosted runner.
    runs-on: ${{ fromJSON(contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) && '["self-hosted","linux","x64","dev-ci","repo-pi-quote"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm run test:e2e
      - run: npm pack --dry-run
